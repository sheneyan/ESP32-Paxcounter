[platformio]
default_envs = cardputer-adv

[env:cardputer-adv]
platform = espressif32@6.10.0
board = esp32-s3-devkitc-1
framework = arduino
extra_scripts = pre:scripts/patch_libpax.py
board_upload.flash_size = 8MB
board_build.partitions = default_8MB.csv
monitor_speed = 115200
build_flags =
    -include shared/cardputer.conf
    -include shared/hal/cardputer_adv.h
    -I shared
    -DCORE_DEBUG_LEVEL=0
    -DLOG_LOCAL_LEVEL=0
    -DPROGVERSION=\"0.1.0\"
    -DLIBPAX_WIFI
    -DLIBPAX_BLE
    -DLIBPAX_ARDUINO
    -DUSE_ESP_IDF_LOG
    -DTAG=__FILE__
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -UBOARD_HAS_PSRAM
build_src_filter = +<*> -<boot.cpp> -<loraconf_abp.cpp>
lib_deps =
    https://github.com/dbinfrago/libpax.git#95758df72ad7981afdff76d1b7f06d4593c77345
    https://github.com/SukkoPera/Arduino-Rokkit-Hash.git#850049440596e4b15188cbb2d8fab7c0d03e3d3d
    bblanchon/ArduinoJson@6.21.5
    makuna/RTC@2.5.0
    mathertel/OneButton@2.6.1
    m5stack/M5Cardputer@1.1.1
    m5stack/M5Unified@0.2.28
    m5stack/M5GFX@0.2.35
    bitbank2/BitBang_I2C@2.2.1
    ricmoo/QRCode@0.0.1
